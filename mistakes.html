<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OLPW - Mistake Notebook</title>
<meta name="description" content="OLPW mistake notebook — review questions you got wrong.">
<script src="olpw-site.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{font-family:Inter,system-ui,sans-serif;background:#F4F6FB;color:#1A1D23;padding:24px}
  main{max-width:760px;margin:0 auto}
  h1{margin-bottom:4px}
  p.lead{color:#6B7280;margin-bottom:16px}
  .m{background:#fff;border:1px solid rgba(22,163,74,.16);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .m b{display:block;margin-bottom:4px}
  .m small{color:#16A34A}
  button{border:1px solid rgba(22,163,74,.32);background:#fff;border-radius:8px;padding:8px 12px;cursor:pointer}
  button:hover{background:#F2FBF5}
</style>
</head>
<body>
<main>
  <h1>📒 Mistake Notebook</h1>
  <p class="lead">Questions you answered incorrectly across all quizzes. Review them, then <a href="index.html">practice again</a>.</p>
  <button id="clearBtn">🗑 Clear notebook</button>
  <p id="empty" style="display:none">No mistakes recorded — great job!</p>
  <div id="list"></div>
</main>
<script>
(function(){
  function render(){
    var list=document.getElementById('list'), empty=document.getElementById('empty');
    var mt=[]; try{mt=JSON.parse(localStorage.getItem('olpw-mistakes')||'[]');}catch(e){}
    list.innerHTML='';
    if(!mt.length){empty.style.display='';return;}
    empty.style.display='none';
    mt.slice().reverse().forEach(function(m){
      var d=document.createElement('div');d.className='m';
      d.innerHTML='<b>'+(m.q||'')+'</b><small>Correct: '+(m.correct||'')+'</small>';
      list.appendChild(d);
    });
  }
  document.getElementById('clearBtn').addEventListener('click',function(){localStorage.removeItem('olpw-mistakes');render();});
  render();
})();
</script>
</body>
</html>
