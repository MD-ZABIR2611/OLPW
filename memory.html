<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="OLPW — Arcanum — Memory of the Spheres. Free O-Level revision notes, quiz questions and study tools.">
    <script src="olpw-site.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcanum — Memory of the Spheres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="olpw-site.css">
<link rel="stylesheet" href="memory.css">
</head>
<body>

<div class="cosmos-bg"></div>
<div class="aurora"></div>
<canvas id="starfield"></canvas>

<main>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-seal" viewBox="0 0 56 56" aria-hidden="true">
        <defs>
          <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff5d6"/>
            <stop offset="0.5" stop-color="#e8b65a"/>
            <stop offset="1" stop-color="#a87a30"/>
          </linearGradient>
        </defs>
        <circle cx="28" cy="28" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
        <circle cx="28" cy="28" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.6"/>
        <circle cx="28" cy="28" r="14" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" opacity="0.4"/>
        <path d="M28 4 L28 52 M4 28 L52 28" stroke="url(#goldGrad)" stroke-width="0.4" opacity="0.5"/>
        <path d="M11 11 L45 45 M45 11 L11 45" stroke="url(#goldGrad)" stroke-width="0.3" opacity="0.4"/>
        <circle cx="28" cy="28" r="3.5" fill="url(#goldGrad)"/>
        <circle cx="28" cy="6" r="1.5" fill="url(#goldGrad)"/>
        <circle cx="28" cy="50" r="1.5" fill="url(#goldGrad)"/>
        <circle cx="6" cy="28" r="1.5" fill="url(#goldGrad)"/>
        <circle cx="50" cy="28" r="1.5" fill="url(#goldGrad)"/>
      </svg>
      <div class="brand-text">
        <h1>ARCANUM</h1>
        <p>Memory of the Spheres</p>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat" id="streakStat">
        <div class="stat-label">Streak</div>
        <div class="stat-value" id="streakVal">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Moves</div>
        <div class="stat-value" id="movesVal">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pairs</div>
        <div class="stat-value" id="pairsVal">0/8</div>
      </div>
      <div class="stat">
        <div class="stat-label">Time</div>
        <div class="stat-value" id="timeVal">0:00</div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="musicToggle" aria-label="Toggle music">
        <span class="music-icon-static" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </span>
        <span class="music-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span id="musicLabel">Music</span>
      </button>
      <button class="btn" id="resetBtn" aria-label="Reset game">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        <span>Reset</span>
      </button>
    </div>
  </header>

  <section class="board-container">
    <div class="board" id="board" role="grid" aria-label="Memory game board"></div>
  </section>

  <footer class="difficulty-bar">
    <span class="difficulty-label">Path</span>
    <button class="btn active" data-diff="apprentice">Apprentice · 4×4</button>
    <button class="btn" data-diff="adept">Adept · 6×4</button>
    <button class="btn" data-diff="master">Master · 6×6</button>
  </footer>
</main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <svg class="modal-rune" viewBox="0 0 56 56" aria-hidden="true">
      <circle cx="28" cy="28" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
      <path d="M28 8 L34 28 L52 28 L38 40 L44 56 L28 46 L12 56 L18 40 L4 28 L22 28 Z"
            fill="url(#goldGrad)" opacity="0.85"/>
    </svg>
    <h2 id="modalTitle">Mastery Achieved</h2>
    <p class="modal-subtitle">The cosmos align in your favor</p>

    <div class="stars" id="starsContainer"></div>

    <div class="modal-stats">
      <div>
        <div class="modal-stat-value" id="finalMoves">0</div>
        <div class="modal-stat-label">Moves</div>
      </div>
      <div>
        <div class="modal-stat-value" id="finalTime">0:00</div>
        <div class="modal-stat-label">Time</div>
      </div>
      <div>
        <div class="modal-stat-value" id="finalStreak">0</div>
        <div class="modal-stat-label">Best Streak</div>
      </div>
    </div>

    <button class="btn btn-primary" id="playAgainBtn">Begin Anew</button>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>


<script src="memory.js"></script>
</body>
</html>
