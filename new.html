<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="olpw-site.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>
<script>
(function () {
  var mode = 'light';
  try { mode = (JSON.parse(localStorage.getItem('olpw-theme') || '{}').mode) || 'light'; } catch (e) {}
  if (mode === 'auto') mode = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', mode === 'light' ? 'light' : 'dark');
})();
</script>
<style>
  :root {
    --bg: #1b1d22; --panel: #262a31; --panel2: #1f2228; --text: #e8e8e8; --muted: #8d939c; --line: #363b44;
    --accent: #7fa650; --accent2: #5b8bd6; --danger: #e5484d; --shadow: rgba(0,0,0,.45);
    --light: #ebecd0; --dark: #779556;
    --bsz: max(280px, min(calc(100vh - 150px), calc(100vw - 420px), 680px));
  }
  [data-theme="light"] {
    --bg: #f3f1ec; --panel: #ffffff; --panel2: #f6f4ef; --text: #1f2328; --muted: #6b7078; --line: #dedad2; --shadow: rgba(30,30,40,.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  button { font-family: inherit; }
  .app { display: flex; gap: 22px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }

  /* ---------- board column ---------- */
  .board-col { display: flex; flex-direction: column; gap: 8px; }
  .pbar { display: flex; align-items: center; gap: 10px; width: calc(var(--bsz) + 26px); padding-left: 26px; }
  .avatar { width: 38px; height: 38px; border-radius: 6px; background: var(--panel); display: grid; place-items: center; font-size: 26px; line-height: 1; box-shadow: 0 1px 3px var(--shadow); font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; }
  .pinfo { flex: 1; min-width: 0; }
  .pname { font-weight: 700; font-size: 14px; display: flex; gap: 6px; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--panel); padding: 1px 6px; border-radius: 4px; }
  .caps { font-size: 17px; line-height: 1; min-height: 18px; color: var(--muted); letter-spacing: -3px; margin-top: 3px; font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", serif; }
  .caps b { font-size: 12px; letter-spacing: 0; margin-left: 7px; font-weight: 700; font-family: system-ui, sans-serif; }
  .checks { color: var(--danger); letter-spacing: 1px; font-size: 13px; margin-left: 4px; }
  .clock { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 22px; font-weight: 700; padding: 5px 12px; border-radius: 6px; background: var(--panel); color: var(--muted); min-width: 96px; text-align: right; }
  .clock.on { background: #f1f1f1; color: #111; }
  [data-theme="light"] .clock.on { background: #2b2f36; color: #fff; }
  .clock.low { color: #fff !important; background: var(--danger) !important; }
  .clock.hidden { visibility: hidden; }

  .board-area { display: flex; gap: 8px; align-items: stretch; }
  .evalbar { width: 18px; border-radius: 4px; overflow: hidden; background: #3a3a3a; position: relative; display: flex; flex-direction: column-reverse; box-shadow: 0 1px 3px var(--shadow); }
  .evalbar.off { visibility: hidden; }
  .evalbar .fill { background: #f4f4f4; height: 50%; transition: height .5s ease; }
  .evalbar span { position: absolute; left: 0; right: 0; font-size: 9px; font-weight: 700; text-align: center; }
  .evalbar span.top { top: 3px; color: #eee; }
  .evalbar span.bot { bottom: 3px; color: #333; }
  .board { position: relative; width: var(--bsz); height: var(--bsz); border-radius: 4px; overflow: hidden; box-shadow: 0 10px 30px var(--shadow); touch-action: none; user-select: none; -webkit-user-select: none; }
  .squares { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { position: relative; }
  .sq.l { background: var(--light); }
  .sq.d { background: var(--dark); }
  .sq.last::after { content: ''; position: absolute; inset: 0; background: rgba(255, 221, 0, .38); }
  .sq.sel::after { content: ''; position: absolute; inset: 0; background: rgba(255, 221, 0, .55); }
  .sq.check::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle, rgba(255,0,0,.95) 0%, rgba(231,0,0,.55) 35%, rgba(169,0,0,0) 72%); z-index: 1; }
  .sq.hover { box-shadow: inset 0 0 0 4px rgba(255,255,255,.75); }
  .sq.hill .hillmark { position: absolute; inset: 38%; border-radius: 50%; border: 2px dashed rgba(0,0,0,.25); }
  .sq.mark::before { content: ''; position: absolute; inset: 0; background: rgba(235, 97, 80, .8); }
  .sq .co { position: absolute; font-size: calc(var(--bsz) / 42); font-weight: 700; pointer-events: none; z-index: 2; }
  .sq .co.r { top: 3%; left: 4%; }
  .sq .co.f { bottom: 2%; right: 5%; }
  .sq.l .co { color: var(--dark); }
  .sq.d .co { color: var(--light); }
  .sq .dot { position: absolute; inset: 36%; border-radius: 50%; background: rgba(0,0,0,.18); z-index: 3; }
  .sq .ring { position: absolute; inset: 0; border-radius: 50%; box-shadow: inset 0 0 0 calc(var(--bsz) / 90) rgba(0,0,0,.18); z-index: 3; }

  .pieces { position: absolute; inset: 0; pointer-events: none; }
  .pc { position: absolute; left: 0; top: 0; width: 12.5%; height: 12.5%; display: grid; place-items: center; will-change: transform; z-index: 4; }
  .pc.dragging { z-index: 20; transition: none !important; }
  .pc.dragging .g { transform: scale(1.12); }
  .pc.ghost { animation: fadeOut .22s ease forwards; z-index: 3; }
  @keyframes fadeOut { to { opacity: 0; transform: scale(.6); } }
  .g { position: relative; font-size: calc(var(--bsz) / 8 * .84); line-height: 1; font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "DejaVu Sans", "Arial Unicode MS", serif; transition: transform .12s; }
  .g span { display: block; }
  .g span + span { position: absolute; left: 0; top: 0; }
  /* classic: filled glyph underneath, outline glyph on top */
  .st-classic .pw .fill { color: #fff; }
  .st-classic .pw .line { color: #1a1a1a; }
  .st-classic .pb .fill { color: #1a1a1a; }
  .st-classic .pb .line { color: #1a1a1a; }
  .st-classic .g { filter: drop-shadow(0 2px 1.5px rgba(0,0,0,.35)); }
  /* solid */
  .st-solid .pw .fill { color: #fafafa; text-shadow: 0 0 1px #000, 0 0 1px #000, 0 0 2px #000, 0 2px 3px rgba(0,0,0,.45); }
  .st-solid .pb .fill { color: #151515; text-shadow: 0 0 1px rgba(255,255,255,.6), 0 2px 3px rgba(0,0,0,.35); }
  .st-solid .line { display: none; }
  /* neo */
  .st-neo .fill { background: linear-gradient(180deg, #fffdf6, #d9d2c0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .st-neo .pb .fill { background: linear-gradient(180deg, #5b5b5b, #121212); -webkit-background-clip: text; background-clip: text; }
  .st-neo .line { color: rgba(0,0,0,.85); }
  .st-neo .pb .line { color: #000; }
  .st-neo .g { filter: drop-shadow(0 3px 2px rgba(0,0,0,.4)); }

  .arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
  .badges { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
  .badge { position: absolute; width: 4.8%; height: 4.8%; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: calc(var(--bsz) / 42); box-shadow: 0 2px 4px rgba(0,0,0,.35); border: 2px solid #fff; line-height: 1; }
  .sq.fog::after { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, rgba(48,52,60,.9) 0 6px, rgba(58,63,72,.9) 6px 12px); }
  .sq.fog .co { color: #9aa1ab !important; z-index: 3; }
  .sq.pre::before { content: ''; position: absolute; inset: 0; background: rgba(220, 60, 60, .45); z-index: 1; }
  .fog-cover { position: absolute; inset: 0; z-index: 28; display: none; place-items: center; text-align: center; background: repeating-linear-gradient(45deg, #2c3038 0 10px, #343944 10px 20px); color: #fff; cursor: pointer; padding: 20px; }
  .fog-cover.on { display: grid; }
  .fog-cover b { display: block; font-size: 22px; margin-bottom: 6px; }
  .fog-cover span { font-size: 14px; opacity: .8; }
  .pocket { display: flex; gap: 3px; flex-wrap: wrap; min-height: 26px; margin-top: 2px; }
  .pk { position: relative; width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; display: grid; place-items: center; padding: 0; }
  .pk .g { font-size: 24px; }
  .pk b { position: absolute; right: -3px; bottom: -3px; background: var(--accent); color: #fff; font-size: 9px; border-radius: 6px; padding: 0 3px; line-height: 13px; }
  .pk.on { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .pk-empty { font-size: 11px; color: var(--muted); line-height: 26px; }
  .avatar.bot { font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; font-size: 22px; }
  .opening { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: -6px; min-height: 0; }
  .opening:empty { display: none; }
  .botcard { display: flex; gap: 10px; align-items: flex-start; }
  .botcard .bav { width: 46px; height: 46px; border-radius: 10px; display: grid; place-items: center; font-size: 28px; flex: none; font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
  .bubble { position: relative; background: var(--panel); border-radius: 10px; padding: 8px 10px; font-size: 13px; font-weight: 600; line-height: 1.35; flex: 1; animation: pop .25s ease; }
  .bubble small { display: block; color: var(--muted); font-weight: 600; font-size: 11px; margin-bottom: 2px; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
  .bgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .bcard { display: flex; gap: 8px; align-items: center; text-align: left; padding: 8px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  .bcard .bav { width: 38px; height: 38px; border-radius: 8px; display: grid; place-items: center; font-size: 22px; flex: none; font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif; }
  .bcard b { display: block; font-size: 13px; }
  .bcard span { display: block; font-size: 11px; color: var(--muted); }
  .bcard.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .bot-bio { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .rv-players { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; text-align: center; margin: 6px 0 10px; }
  .rv-acc { font-size: 26px; font-weight: 800; padding: 6px 10px; border-radius: 8px; display: inline-block; min-width: 76px; }
  .rv-acc.acc-w { background: #fff; color: #222; border: 1px solid var(--line); }
  .rv-acc.acc-b { background: #333; color: #fff; border: 1px solid #333; }
  .rv-name { font-size: 12px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rv-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  .rv-table td { padding: 4px 6px; }
  .rv-table td:first-child, .rv-table td:last-child { text-align: center; font-weight: 700; width: 70px; }
  .rv-table td:nth-child(2) { white-space: nowrap; padding-left: 28%; }
  .rv-table tr:last-child td { border-top: 1px solid var(--line); padding-top: 8px; }
  .rv-ico { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; color: #fff; font-size: 10px; font-weight: 800; }
  .graph { width: 100%; height: 90px; border-radius: 8px; overflow: hidden; background: #3a3a3a; cursor: pointer; display: block; }
  .rv-msg { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .rv-msg .bubble { font-weight: 500; }
  .progress { height: 8px; border-radius: 4px; background: var(--panel2); overflow: hidden; margin: 12px 0 4px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; margin: 8px 0; }
  .stats div { background: var(--panel2); border-radius: 8px; padding: 8px 4px; }
  .stats b { display: block; font-size: 20px; }
  .stats span { font-size: 11px; color: var(--muted); }
  .arch { max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .arow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; background: var(--panel2); border-radius: 8px; padding: 8px 10px; font-size: 12px; }
  .arow b { font-size: 13px; }
  .arow .meta { color: var(--muted); }
  .arow .btns2 { display: flex; gap: 4px; }
  .arow .btns2 .b { padding: 6px 8px; font-size: 12px; }
  .delta-up { color: #2fa84f; font-weight: 700; } .delta-down { color: var(--danger); font-weight: 700; }
  .boom { position: absolute; width: 12.5%; height: 12.5%; z-index: 15; pointer-events: none; }
  .boom::before { content: ''; position: absolute; inset: -60%; border-radius: 50%; background: radial-gradient(circle, rgba(255,240,150,.95), rgba(255,120,0,.75) 40%, rgba(255,40,0,0) 70%); animation: boom .5s ease-out forwards; }
  @keyframes boom { from { transform: scale(.2); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }

  .promo-pick { position: absolute; z-index: 30; width: 12.5%; display: none; flex-direction: column; background: var(--panel); box-shadow: 0 6px 20px rgba(0,0,0,.5); border-radius: 4px; overflow: hidden; }
  .promo-pick.on { display: flex; }
  .promo-pick button { aspect-ratio: 1; border: none; background: var(--panel); cursor: pointer; display: grid; place-items: center; }
  .promo-pick button:hover { background: var(--accent); }
  .promo-pick .x { aspect-ratio: auto; padding: 4px; font-size: 14px; color: var(--muted); background: var(--panel2); }
  .viewing-banner { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); z-index: 25; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; display: none; cursor: pointer; }
  .viewing-banner.on { display: block; }

  /* ---------- side panel ---------- */
  .side { width: 340px; background: var(--panel); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 6px 24px var(--shadow); max-height: calc(var(--bsz) + 110px); min-height: 420px; }
  .side-head h1 { font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .side-head .sub { font-size: 12px; color: var(--muted); margin-top: 2px; font-weight: 600; }
  .status { padding: 11px 12px; border-radius: 8px; background: var(--panel2); font-weight: 700; font-size: 14px; line-height: 1.35; }
  .status.check { color: var(--danger); }
  .status.over { color: var(--accent); }
  .status small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .dots::after { content: ''; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
  .thinkbar { height: 4px; border-radius: 3px; background: var(--panel2); overflow: hidden; margin-top: -8px; visibility: hidden; }
  .thinkbar.on { visibility: visible; }
  .thinkbar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .puzzle-box { display: none; background: var(--panel2); border-radius: 8px; padding: 12px; font-size: 13px; }
  .puzzle-box.on { display: block; }
  .puzzle-box .pt { font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .puzzle-box .pd { color: var(--muted); margin-bottom: 10px; }
  .puzzle-box .row { display: flex; gap: 6px; }
  .puzzle-box button { flex: 1; }
  .puzzle-box .tip { color: var(--muted); font-size: 12px; line-height: 1.45; margin: -4px 0 10px; }
  .puzzle-box .fb { padding: 8px 10px; border-radius: 7px; background: var(--panel); margin-bottom: 8px; font-weight: 600; line-height: 1.4; }
  .puzzle-box .fb small { display: block; font-weight: 500; color: var(--muted); }
  .qstats { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .qstats span { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 10px; background: var(--panel); }
  .q-best { color: #2fa84f; } .q-good { color: #6d9f3a; } .q-inaccuracy { color: #d2a019; } .q-mistake { color: #e07b22; } .q-blunder { color: var(--danger); }
  .moves .m i { font-style: normal; margin-left: 2px; font-size: 11px; }
  .rush-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .rush-score { font-size: 30px; font-weight: 800; line-height: 1; }
  .rush-time { font-family: ui-monospace, Consolas, monospace; font-size: 22px; font-weight: 700; padding: 4px 10px; border-radius: 6px; background: var(--panel); }
  .rush-lives { font-size: 16px; letter-spacing: 2px; }
  .rushlog { display: flex; flex-wrap: wrap; gap: 3px; margin-bottom: 10px; min-height: 10px; }
  .rushlog i { width: 10px; height: 10px; border-radius: 2px; background: #2fa84f; }
  .rushlog i.no { background: var(--danger); }
  .result-modal .rushlog { justify-content: center; margin: 4px 0 6px; }
  .board.blind-all .pc, .board.blind-opp .pc.opp { opacity: 0; transition: opacity .25s; }
  .board.blind-all .pc.dragging, .board.blind-opp .pc.opp.dragging { opacity: .9; }
  .modal input.fen { width: 100%; padding: 9px 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2); color: var(--text); font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .modal input.fen.bad { border-color: var(--danger); }
  .modal .label small { text-transform: none; letter-spacing: 0; font-weight: 500; }
  .moves { flex: 1; min-height: 110px; overflow-y: auto; background: var(--panel2); border-radius: 8px; padding: 6px 4px; font-size: 13px; }
  .moves .mr { display: grid; grid-template-columns: 34px 1fr 1fr; align-items: center; }
  .moves .mr:nth-child(odd) { background: rgba(127,127,127,.06); }
  .moves .n { color: var(--muted); text-align: right; padding-right: 8px; font-size: 12px; }
  .moves .m { padding: 3px 6px; border-radius: 4px; cursor: pointer; font-weight: 600; font-family: ui-monospace, Consolas, monospace; }
  .moves .m:hover { background: rgba(127,127,127,.18); }
  .moves .m.cur { background: var(--accent); color: #fff; }
  .moves .empty { color: var(--muted); font-size: 12px; padding: 8px; text-align: center; }
  .moves .res { text-align: center; font-weight: 700; padding: 6px; color: var(--muted); }
  .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .b, .nav button { padding: 9px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; transition: .15s; }
  .b:hover:not(:disabled), .nav button:hover:not(:disabled) { border-color: var(--accent); }
  .b:disabled, .nav button:disabled { opacity: .38; cursor: not-allowed; }
  .b.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .b.red:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .note { font-size: 12px; color: var(--muted); line-height: 1.45; }

  /* ---------- modals ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .overlay.on { display: flex; }
  .modal { background: var(--panel); border-radius: 12px; padding: 22px; max-width: 560px; width: 100%; max-height: calc(100vh - 32px); overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
  .modal h2 { margin-bottom: 6px; font-size: 20px; }
  .modal p { color: var(--muted); margin-bottom: 16px; font-size: 14px; line-height: 1.5; }
  .modal .label { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 14px 0 8px; }
  .modal .actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }
  .modal .actions .b { padding: 10px 18px; font-size: 14px; }
  .result-modal { text-align: center; }
  .result-modal .actions { justify-content: center; }
  .result-big { font-size: 44px; margin: 4px 0 6px; font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", serif; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { flex: 1 1 auto; padding: 9px 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; }
  .seg button small { display: block; font-size: 10px; font-weight: 500; opacity: .75; margin-top: 2px; }
  .seg button.on { border-color: var(--accent); background: var(--accent); color: #fff; }
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .vcard { text-align: left; padding: 10px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  .vcard b { display: block; font-size: 13px; }

<script>

const WORKER_SRC = `
const E = ChessEngine();
self.onmessage = (e) => {
  const { id, pos, opts } = e.data;
  try {
    const r = E.search(pos, Object.assign({}, opts, { onInfo: info => self.postMessage({ id, type: 'info', info }) }));

  } catch (err) { self.postMessage({ id, type: 'error', message: String(err && err.message || err) }); }

class EngineClient {
  constructor() { this.id = 0; this.pending = null; this.spawn(); }
  spawn() {
    try {
      const url = URL.createObjectURL(new Blob([ChessEngine.toString() + '\n' + WORKER_SRC], { type: 'text/javascript' }));
      this.worker = new Worker(url);
      this.worker.onmessage = e => this.onMsg(e.data);
      this.worker.onerror = () => { this.worker = null; };
    } catch (e) { this.worker = null; }
  }
  run(pos, opts, onInfo) {

    return new Promise((resolve, reject) => {

      if (this.worker) this.worker.postMessage({ id, pos: clean, opts });

  if (!((minAtt < V[piece] || !defended) && gained + 1 < V[piece])) return false;

      ${canRematch ? '<button class="b" data-a="rematch">Rematch (swap colours)</button>' : ''}
      ${reviewAllowed() ? '<button class="b" data-a="review" style="border-color:#81b64c;color:#81b64c">📈 Game Review</button>' : ''}
      <button class="b${nextEg ? '' : ' primary'}" data-a="again">${G.mode === 'endgame' ? 'Retry' : 'Play again'}</button>
      ${nextEg ? '<button class="b primary" data-a="next">Next endgame ▶</button>' : ''}
    </div>`, md => {
    md.querySelector('[data-a="close"]').onclick = hideModal;
    md.querySelector('[data-a="again"]').onclick = () => { hideModal(); newGame(G.mode === 'endgame' ? { mode: 'endgame', endgame: G.endgame.i } : again); };
    const rvb = md.querySelector('[data-a="review"]');
    if (rvb) rvb.onclick = () => { hideModal(); startReview(); };
    const nx = md.querySelector('[data-a="next"]');
    if (nx) nx.onclick = () => { hideModal(); newGame({ mode: 'endgame', endgame: G.endgame.i + 1 }); };
    const rm = md.querySelector('[data-a="rematch"]');
    if (rm) rm.onclick = () => { hideModal(); newGame(Object.assign({}, again, { color: E.other(G.human) })); };
  }, 'result-modal');
}
function showRushResult() {
  const R = G.rush;
  showModal(`<div class="result-big">${R.record ? '🏆' : '⚡'}</div><h2>${R.score} puzzle${R.score === 1 ? '' : 's'} solved</h2>
    <p>${G.result.reason} · ${R.label}${R.record ? ' · New personal best!' : ` · Best: ${Math.max(R.prev || 0, R.score)}`}</p>
    <div class="rushlog">${R.log.map(ok => `<i class="${ok ? '' : 'no'}"></i>`).join('')}</div>
    <div class="actions"><button class="b" data-a="close">Close</button><button class="b primary" data-a="again">Play again</button></div>`, md => {
    md.querySelector('[data-a="close"]').onclick = hideModal;
    md.querySelector('[data-a="again"]').onclick = () => { hideModal(); newGame({ mode: 'rush', rushTime: RUSH_TIMES.findIndex(r => r[0] === R.secs) }); };
  }, 'result-modal');
}
function confirmModal(title, text, yes, onYes) {
  showModal(`<h2>${title}</h2><p>${text}</p><div class="actions"><button class="b" data-a="no">Cancel</button><button class="b primary" data-a="yes">${yes}</button></div>`, md => {
    md.querySelector('[data-a="no"]').onclick = hideModal;
    md.querySelector('[data-a="yes"]').onclick = () => { hideModal(); onYes(); };
  });
}

function showNewGame() {
  const c = Object.assign({}, settings.last);
  const draw = () => {
    const segBtns = (items, key) => items.map(([v, label, small]) => `<button data-k="${key}" data-v="${v}" class="${String(c[key]) === String(v) ? 'on' : ''}">${label}${small ? `<small>${small}</small>` : ''}</button>`).join('');
    const modes = Object.entries(MODES).map(([k, m]) => [k, m.name, m.desc]);
    const variants = Object.entries(VARIANTS).map(([k, v]) => `<button class="vcard${c.variant === k ? ' on' : ''}" data-k="variant" data-v="${k}"><b>${v.name}</b><span>${v.desc.split('. ')[0].replace(/\.$/, '')}.</span></button>`).join('');
    const levels = Object.entries(LEVELS).map(([k, l]) => [k, l.name, l.elo + (l.noUndo ? ' · no takebacks' : '')]);
    const clocks = CLOCKS.map((t, i) => [i, t[2], t[3]]);
    const puzzles = PUZZLES.map((p, i) => `<button data-k="puzzle" data-v="${i}" class="${(c.puzzle || 0) === i ? 'on' : ''}${solvedPuzzles[i] ? ' done' : ''}">${solvedPuzzles[i] ? '✓ ' : ''}#${i + 1} · M${p.n}</button>`).join('');
    const endgames = ENDGAMES.map((g, i) => `<button data-k="endgame" data-v="${i}" class="${(c.endgame || 0) === i ? 'on' : ''}${solvedEndgames[i] ? ' done' : ''}">${solvedEndgames[i] ? '✓ ' : ''}${g.title}</button>`).join('');
    const odds = Object.entries(ODDS).map(([k, o]) => [k, o.short, 'computer has no ' + o.short.toLowerCase()]);
    const blinds = Object.entries(BLIND).map(([k, n]) => [k, n]);
    const rushTimes = RUSH_TIMES.map((r, i) => [i, r[1], (r[2] ? r[2] : 'timed') + (rushBest[r[0]] ? ' · best ' + rushBest[r[0]] : '')]);
    const bots = BOTS.map(b => `<button class="bcard${c.bot === b.id ? ' on' : ''}" data-k="bot" data-v="${b.id}"><span class="bav" style="background:${b.bg}">${b.emoji}</span><span style="color:var(--text);font-size:inherit"><b>${b.name}</b><span>${b.rating}${b.style ? ' · ' + ({ aggr: 'attacker', queen: 'queen lover', pawn: 'pawn pusher', trade: 'trader' })[b.style] : ''}</span></span></button>`).join('');
    const bot = botOf(c.bot);
    const m = c.mode;
    const has = list => list.includes(m);
    const fenOk = has(['ai', 'bots', 'pvp', 'analysis', 'coach', 'blind', 'cvc']);
    showModal(`<h2>New game</h2><p>Choose how you want to play.</p>
      <div class="label">Mode</div><div class="seg">${segBtns(modes, 'mode')}</div>
      ${!has(['puzzle', 'rush', 'endgame', 'odds']) ? `<div class="label">Variant</div><div class="vgrid">${variants}</div>` : ''}
      ${m === 'bots' ? `<div class="label">Opponent</div><div class="bgrid">${bots}</div>
        <div class="botcard" style="margin-top:10px"><div class="bav" style="background:${bot.bg}">${bot.emoji}</div><div class="bubble"><small>${bot.name} · ${bot.rating}</small>${bot.bio}</div></div>
        <div class="toggles"><label class="tgl"><input type="checkbox" id="ngChal"${c.challenge ? ' checked' : ''}> Challenge mode (no takebacks, no hints)</label></div>` : ''}
      ${m === 'odds' ? `<div class="label">Handicap</div><div class="seg">${segBtns(odds, 'odds')}</div>` : ''}
      ${m === 'blind' ? `<div class="label">Blindfold</div><div class="seg">${segBtns(blinds, 'blind')}</div>` : ''}
      ${has(['ai', 'cvc', 'coach', 'odds', 'blind']) ? `<div class="label">Computer level</div><div class="seg">${segBtns(levels, 'level')}</div>` : ''}
      ${has(['ai', 'bots', 'coach', 'odds', 'blind']) ? `<div class="label">Play as</div><div class="seg">${segBtns([['w', '♔ White'], ['random', '🎲 Random'], ['b', '♚ Black']], 'color')}</div>` : ''}
      ${has(['ai', 'bots', 'pvp', 'odds', 'blind']) ? `<div class="label">Time control</div><div class="seg">${segBtns(clocks, 'tc')}</div>` : ''}
      ${m === 'pvp' ? `<div class="label">Options</div><div class="toggles"><label class="tgl"><input type="checkbox" id="ngFlip"${settings.autoFlip ? ' checked' : ''}> Flip board after each move</label></div>` : ''}
      ${m === 'puzzle' ? `<div class="label">Puzzle</div><div class="pgrid">${puzzles}</div>` : ''}
      ${m === 'rush' ? `<div class="label">Length</div><div class="seg">${segBtns(rushTimes, 'rushTime')}</div>` : ''}
      ${m === 'endgame' ? `<div class="label">Endgame</div><div class="pgrid">${endgames}</div>` : ''}
      ${fenOk ? `<div class="label">Start position <small>(optional — paste a FEN, standard rules)</small></div><input class="fen" id="ngFen" spellcheck="false" placeholder="e.g. r1bqkbnr/pppp1ppp/2n5/4p3/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 2 3" value="${(c.fen || '').replace(/"/g, '')}">` : ''}
      <div class="actions"><button class="b" data-a="cancel">Cancel</button><button class="b primary" data-a="start">Start game</button></div>`, md => {
      md.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
        const k = b.dataset.k, v = b.dataset.v;
        c[k] = ['tc', 'puzzle', 'endgame', 'rushTime'].includes(k) ? +v : v;
        draw();
      });
      const ch = md.querySelector('#ngChal');
      if (ch) ch.onchange = () => { c.challenge = ch.checked; };
      const fl = md.querySelector('#ngFlip');
      if (fl) fl.onchange = () => { settings.autoFlip = fl.checked; saveSettings(); };
      const fenIn = md.querySelector('#ngFen');
      if (fenIn) fenIn.oninput = () => { c.fen = fenIn.value; fenIn.classList.toggle('bad', !!c.fen.trim() && !checkFEN(c.fen)); };
      md.querySelector('[data-a="cancel"]').onclick = hideModal;
      md.querySelector('[data-a="start"]').onclick = () => {
        const fen = fenOk && c.fen && c.fen.trim() ? c.fen.trim() : '';
        if (fen && !checkFEN(fen)) { fenIn.classList.add('bad'); toast('That FEN is not a valid position'); return; }
        hideModal();
        settings.last = { mode: c.mode, variant: c.variant, level: c.level, color: c.color, tc: c.tc, puzzle: c.puzzle || 0, odds: c.odds, blind: c.blind, rushTime: c.rushTime, endgame: c.endgame || 0, bot: c.bot, challenge: !!c.challenge };
        saveSettings();
        newGame(Object.assign({}, settings.last, fen ? { fen } : {}));
      };
    });
  };
  draw();
}

function getPageMode() { try { return JSON.parse(localStorage.getItem('olpw-theme') || '{}').mode || 'light'; } catch (e) { return 'light'; } }
function setPageMode(mode) {
  let cfg = {};
  try { cfg = JSON.parse(localStorage.getItem('olpw-theme') || '{}'); } catch (e) {}
  cfg.mode = mode;
  try { localStorage.setItem('olpw-theme', JSON.stringify(cfg)); } catch (e) {}
  let eff = mode;
  if (mode === 'auto') eff = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', eff === 'light' ? 'light' : 'dark');
}
function showSettings() {
  const draw = () => {
    const themes = Object.entries(BOARD_THEMES).map(([id, t]) => `<button class="theme-opt${id === settings.board ? ' on' : ''}" data-board="${id}"><span class="swatch"><i style="background:${t.light}"></i><i style="background:${t.dark}"></i><i style="background:${t.dark}"></i><i style="background:${t.light}"></i></span>${t.name}</button>`).join('');
    const pieces = Object.entries(PIECE_STYLES).map(([id, n]) => `<button data-pieces="${id}" class="${settings.pieces === id ? 'on' : ''}"><span class="st-${id}" style="display:inline-flex;gap:2px;font-size:24px">${pieceHTML('N').replace('class="g', 'style="font-size:26px" class="g')}${pieceHTML('n').replace('class="g', 'style="font-size:26px" class="g')}</span><small>${n}</small></button>`).join('');
    const pm = getPageMode();
    const tg = (k, label) => `<label class="tgl"><input type="checkbox" data-t="${k}"${settings[k] ? ' checked' : ''}> ${label}</label>`;
    showModal(`<h2>Settings</h2>
      <div class="label">Board</div><div class="themes">${themes}</div>
      <div class="label">Pieces</div><div class="seg">${pieces}</div>
      <div class="label">Page</div><div class="seg">${[['dark', 'Dark'], ['light', 'Light'], ['auto', 'Auto']].map(([v, n]) => `<button data-page="${v}" class="${pm === v ? 'on' : ''}">${n}</button>`).join('')}</div>
      <div class="label">Options</div><div class="toggles">${tg('sound', 'Sound effects')}${tg('legal', 'Show legal moves')}${tg('coords', 'Show coordinates')}${tg('anim', 'Animate pieces')}${tg('autoQueen', 'Auto-promote to queen')}${tg('autoFlip', 'Auto-flip in 2-player')}${tg('premove', 'Premoves (queue a move on the opponent\'s turn)')}${tg('chat', 'Bot chat messages')}</div>
      <p style="margin:14px 0 0">Tip: right-click and drag on the board to draw arrows; right-click a square to mark it.</p>
      <div class="actions"><button class="b primary" data-a="done">Done</button></div>`, md => {
      md.querySelectorAll('[data-board]').forEach(b => b.onclick = () => { settings.board = b.dataset.board; saveSettings(); render(); draw(); });
      md.querySelectorAll('[data-pieces]').forEach(b => b.onclick = () => { settings.pieces = b.dataset.pieces; saveSettings(); render(); draw(); });
      md.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { setPageMode(b.dataset.page); draw(); });
      md.querySelectorAll('[data-t]').forEach(i => i.onchange = () => { settings[i.dataset.t] = i.checked; saveSettings(); render(); });
      md.querySelector('[data-a="done"]').onclick = hideModal;
    });
  };
  draw();
}

/* ================= PGN ================= */
function pgn() {
  const d = new Date();
  const names = { w: playerName('w'), b: playerName('b') };
  const tags = [
    ['Event', 'OLPW ' + MODES[G.mode].name], ['Site', location.host || 'OLPW'],
    ['Date', `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`],
    ['White', names.w.n + (names.w.tag ? ' (' + names.w.tag + ')' : '')], ['Black', names.b.n + (names.b.tag ? ' (' + names.b.tag + ')' : '')],
    ['Result', resultScore().replace('½-½', '1/2-1/2')]
  ];
  if (G.variant !== 'standard') tags.push(['Variant', VARIANTS[G.variant].name]);
  if (G.startFEN !== E.startFEN('standard') || G.variant !== 'standard') { tags.push(['SetUp', '1']); tags.push(['FEN', G.startFEN]); }
  if (G.result) tags.push(['Termination', G.result.reason]);
  const op = openingName(G.moves.length);
  if (op) tags.push(['Opening', op]);
  let body = '';
  const start = G.positions[0];
  G.moves.forEach((m, i) => {
    const ply = i + (start.turn === 'b' ? 1 : 0);
    if (ply % 2 === 0) body += (start.full + ply / 2) + '. ';
    else if (i === 0) body += start.full + '... ';
    body += m.san + ' ';
  });
  body += resultScore().replace('½-½', '1/2-1/2');
  return tags.map(([k, v]) => `[${k} "${v}"]`).join('\n') + '\n\n' + body.trim();
}
function copyText(txt) {
  const done = () => toast('PGN copied to clipboard');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback() {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('Could not copy'); }
    ta.remove();
  }
}

/* ================= persistence ================= */
function saveGame() {
  if (!G || G.archived || ['puzzle', 'rush', 'endgame'].includes(G.mode)) return;
  try {
    localStorage.setItem(GKEY, JSON.stringify({ mode: G.mode, variant: G.variant, level: G.level, human: G.human, startFEN: G.startFEN, moves: G.moves.map(m => m.uci + (m.castle ? '@' + m.castle : '')), clock: G.clock, time: G.time, result: G.result, orient: G.orient, odds: G.odds, blind: G.blind, custom: G.custom, peeks: G.peeks,
      bot: G.bot, challenge: G.challenge, takebacks: G.takebacks, hints: G.hints }));
  } catch (e) {}
}
function loadGame() {
  try {
    const s = JSON.parse(localStorage.getItem(GKEY) || 'null');
    if (!s || s.result || !MODES[s.mode] || !VARIANTS[s.variant] || ['puzzle', 'rush', 'endgame'].includes(s.mode)) return false;
    if (s.mode === 'odds' && !ODDS[s.odds]) return false;
    const start = E.parseFEN(s.startFEN, s.variant);
    G = blankGame({ mode: s.mode, variant: s.variant, level: s.level, human: s.human, custom: !!s.custom,
      bot: s.mode === 'bots' ? botOf(s.bot).id : null, challenge: s.mode === 'bots' && !!s.challenge, takebacks: s.takebacks || 0, hints: s.hints || 0,
      odds: s.mode === 'odds' ? s.odds : null, blind: s.mode === 'blind' ? (BLIND[s.blind] ? s.blind : 'all') : null, peeks: s.peeks || 0,
      coach: s.mode === 'coach' ? { counts: { best: 0, good: 0, inaccuracy: 0, mistake: 0, blunder: 0 }, last: null, busy: false } : null,
      positions: [start], keys: [E.key(start)], startFEN: s.startFEN, clock: s.clock, time: s.time, orient: s.orient || 'w' });
    replayMoves(s.moves);
    resetUI();
    refreshLegal();
    render();
    if (G.clock) startClock();
    afterPositionChange();
    toast('Resumed your last game');
    return true;
  } catch (e) { return false; }
}

/* ================= buttons & keys ================= */
$('btnNew').onclick = showNewGame;
$('btnUndo').onclick = undo;
$('btnFlip').onclick = () => { G.orient = E.other(G.orient); render(); };
$('btnHint').onclick = showHint;
$('btnSettings').onclick = showSettings;
$('btnPgn').onclick = () => copyText(pgn());
$('btnReview').onclick = startReview;
$('btnProfile').onclick = showProfile;
['barTop', 'barBottom'].forEach(id => $(id).addEventListener('click', e => {
  const b = e.target.closest('[data-drop]');
  if (!b) return;
  if (!canHumanMove() || b.dataset.col !== cur().turn) { toast(G.view != null ? 'Go back to the current move first' : 'You can only drop your own pieces on your turn'); return; }
  dropSel = dropSel === b.dataset.drop ? null : b.dataset.drop;
  selected = -1;
  render();
}));
$('btnDraw').onclick = () => {
  if (G.result) return;
  if (G.mode === 'pvp') return confirmModal('Draw offered', `${cur().turn === 'w' ? 'White' : 'Black'} offers a draw. Does the opponent accept?`, 'Accept draw', () => endGame(null, 'Draw by agreement'));
  if (vsAI()) {
    const aiEval = G.lastEval == null ? 0 : G.lastEval;
    const accept = G.moves.length >= 30 ? aiEval <= 40 : aiEval <= -150;
    if (accept) endGame(null, 'Draw by agreement');
    else toast('The computer declines the draw');
  }
};
$('btnResign').onclick = () => {
  if (G.result) return;
  if (G.mode === 'cvc') return endGame(null, 'Stopped');
  const loser = vsAI() ? G.human : cur().turn;
  confirmModal(G.mode === 'endgame' ? 'Give up?' : 'Resign?', vsAI() ? 'The computer will win this game.' : `${loser === 'w' ? 'White' : 'Black'} resigns the game.`, G.mode === 'endgame' ? 'Give up' : 'Resign', () => endGame(E.other(loser), 'Resignation'));
};
$('navFirst').onclick = () => setView(0);
$('navPrev').onclick = () => setView(shownIdx() - 1);
$('navNext').onclick = () => setView(shownIdx() + 1);
$('navLast').onclick = () => setView(null);
$('viewBanner').onclick = () => setView(null);
$('moves').addEventListener('click', e => { const m = e.target.closest('[data-i]'); if (m) setView(+m.dataset.i); });
document.addEventListener('keydown', e => {
  if ($('overlay').classList.contains('on')) { if (e.key === 'Escape') hideModal(); return; }
  if (!G) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); setView(shownIdx() - 1); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); setView(shownIdx() + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); setView(0); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); setView(null); }
  else if (e.key === 'Escape') { selected = -1; dropSel = null; premoveFrom = -1; G.premove = null; hidePromo(); render(); }
  else if ((e.key === 'z' || e.key === 'Z') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); undo(); }
  else if (e.key === 'f' || e.key === 'F') { G.orient = E.other(G.orient); render(); }
  else if (e.key === 'p' || e.key === 'P') peek();
});
window.addEventListener('resize', () => { if (G) renderPieces(); });

if (!loadGame()) newGame(settings.last);
</script>
