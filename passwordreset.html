<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
<meta name="description" content="OLPW — OLPW - Reset Password. Free O-Level revision notes, quiz questions and study tools.">
    <script src="olpw-site.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLPW - Reset Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="olpw-site.css">
<link rel="stylesheet" href="passwordreset.css">
</head>
<body>

    <div id="authScreen">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">OLPW<span>.</span></div>
                <div class="auth-sub">O-Level Platform Web</div>
            </div>
            
            <div id="resetFormView">
                <h3 style="color:#fff; margin-bottom: 20px; font-size: 20px;">Reset Your Password</h3>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Enter your new password below.</p>
                <div id="authAlert" class="alert hidden"></div>
                
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" class="form-input" placeholder="At least 6 characters" required>
                </div>
                <button class="auth-btn" id="resetBtn">Update Password</button>
            </div>

            <div id="successView" class="hidden">
                <h3 style="color:#fff; margin-bottom: 20px; font-size: 20px;">Success!</h3>
                <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 24px;">Your password has been updated. You can now log in with your new password.</p>
                <a href="index.html" class="auth-btn" style="display: block; text-align: center; text-decoration: none;">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    
<script src="passwordreset.js"></script>
</body>
</html>
