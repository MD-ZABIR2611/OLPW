<!DOCTYPE html>
<!-- OLPW:chess.html | chess -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="description" content="OLPW — Chess. Free O-Level revision notes, quiz questions and study tools.">
<script src="olpw-site.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess</title>


<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="assets/logo-64.png">
<link rel="apple-touch-icon" href="assets/logo-192.png">
<link rel="stylesheet" href="olpw-site.css">
<link rel="stylesheet" href="css/chess.css">
</head>
<body>

<div class="app">
  <div class="board-col">
    <div class="pbar" id="barTop"></div>
    <div class="board-area">
      <div class="evalbar off" id="evalbar"><div class="fill"></div><span class="top"></span><span class="bot"></span></div>
      <div class="board" id="board">
        <div class="squares" id="squares"></div>
        <div class="pieces" id="pieces"></div>
        <svg class="arrows" id="arrows" viewBox="0 0 8 8"></svg>
        <div class="badges" id="badges"></div>
        <div class="fog-cover" id="fogCover"></div>
        <div class="promo-pick" id="promoPick"></div>
        <div class="viewing-banner" id="viewBanner">Reviewing — click to return to the game</div>
        <div class="phasebar" id="phaseBar"></div>
      </div>
    </div>
    <div class="pbar" id="barBottom"></div>
  </div>

  <aside class="side">
    <div class="side-head"><h1>♞ Chess</h1><div class="sub" id="gameTitle"></div></div>
    <div class="status" id="status"></div>
    <div class="thinkbar" id="thinkbar"><i></i></div>
    <div class="opening" id="opening"></div>
    <div class="puzzle-box" id="puzzleBox"></div>
    <div class="moves" id="moves"></div>
    <div class="nav">
      <button id="navFirst" title="First move">⏮</button>
      <button id="navPrev" title="Previous move (←)">◀</button>
      <button id="navNext" title="Next move (→)">▶</button>
      <button id="navLast" title="Latest move">⏭</button>
    </div>
    <div class="btns">
      <button class="b primary" id="btnNew">＋ New Game</button>
      <button class="b" id="btnUndo">↶ Takeback</button>
      <button class="b" id="btnFlip">⇅ Flip Board</button>
      <button class="b" id="btnHint">💡 Hint</button>
      <button class="b" id="btnDraw">½ Offer Draw</button>
      <button class="b red" id="btnResign">⚑ Resign</button>
      <button class="b" id="btnEditor">✏️ Board Editor</button>
      <button class="b" id="btnPgn">📋 Copy PGN</button>
      <button class="b" id="btnSettings">⚙ Settings</button>
      <button class="b" id="btnReview">📈 Game Review</button>
      <button class="b" id="btnDaily">🗓 Daily Puzzle</button>
      <button class="b" id="btnProfile">👤 Profile &amp; Games</button>
    </div>
    <div class="note" id="variantNote"></div>
  </aside>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>



<script src="js/chess.js"></script>
</body>
</html>
