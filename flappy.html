<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OLPW — Flappy Bird</title>
<meta name="description" content="OLPW — Flappy Bird: test your reflexes!">
<link rel="stylesheet" href="css/flappy.css">
<script src="flappyjs/flappy.js"></script>
</head>
<body>
<canvas id="gameCanvas" width="320" height="512"></canvas>
<div id="startScreen">
  <h1>Flappy Bird</h1>
  <p>Tap to fly</p>
  <button id="startBtn">Start</button>
</div>
<div id="gameOverScreen" style="display:none;">
  <h1>Game Over</h1>
  <p>Score: <span id="finalScore">0</span></p>
  <button id="restartBtn">Restart</button>
  <button id="menuBtn">Menu</button>
</div>
<script>
var Game = {
  init: function() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.pipeGap = 120;
    this.groundHeight = 500;
    this.reset();
    this.bindEvents();
  },
  reset: function() {
    this.bird = { x: 50, y: 200, vy: 0, rotation: 0, alive: true };
    this.pipes = [];
    this.frame = 0;
    this.score = 0;
    this.gameOver = false;
    this.gravity = 0.6;
    this.lift = -10;
    this.pipeSpeed = 3;
  },
  bindEvents: function() {
    var self = this;
    window.addEventListener('click', function(e) {
      if (!self.bird.alive) return;
      self.bird.vy = self.lift;
    });
    document.getElementById('startBtn').addEventListener('click', function() {
      document.getElementById('startScreen').style.display = 'none';
    });
    document.getElementById('restartBtn').addEventListener('click', function() {
      self.reset();
      document.getElementById('gameOverScreen').style.display = 'none';
      self.loop();
    });
    document.getElementById('menuBtn').addEventListener('click', function() {
      self.reset();
      document.getElementById('startScreen').style.display = 'block';
      document.getElementById('gameOverScreen').style.display = 'none';
    });
  },
  update: function() {
    if (!this.bird.alive) return;
    this.frame++;
    // gravity
    this.bird.vy += this.gravity;
    this.bird.y += this.bird.vy;
    // rotation
    this.bird.rotation = Math.max(-90, Math.min(25, this.bird.vy * 5));
    // pipes
    if (this.frame % 90 === 0) {
      var pipeTopHeight = Math.random() * (this.groundHeight - this.pipeGap - 50) + 20;
      this.pipes.push({ x: 320, topH: pipeTopHeight, passed: false });
    }
    this.pipes.forEach(function(pipe) {
      pipe.x -= self.pipeSpeed;
      if (!pipe.passed && pipe.x < 50) {
        pipe.passed = true;
        self.score++;
      }
      if (pipe.x + 50 < 0) {
        self.pipes.shift();
      }
      // collision
      if (pipe.x < 80 && pipe.x > 30) {
        if (self.bird.y < pipe.topH || self.bird.y > pipe.topH + self.pipeGap) {
          self.bird.alive = false;
        }
      }
    });
    // ground collision
    if (this.bird.y + 30 > this.groundHeight) {
      self.bird.alive = false;
    }
    // top collision
    if (this.bird.y < 0) {
      self.bird.alive = false;
    }
  },
  draw: function() {
    var ctx = this.ctx;
    // clear
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    
    // bird
    ctx.save();
    ctx.translate(this.bird.x + 20, this.bird.y + 20);
    ctx.rotate(this.bird.rotation * Math.PI / 180);
    ctx.fillStyle = '#e91e63';
    ctx.fillRect(-20, -20, 40, 40);
    ctx.restore();
    
    // pipes
    this.pipes.forEach(function(pipe) {
      var pipeX = pipe.x;
      var pipeTopH = pipe.topH;
      ctx.fillStyle = '#ff5722';
      ctx.fillRect(pipeX, 0, 50, pipeTopH);
      ctx.fillRect(pipeX, pipeTopH + self.pipeGap, 50, self.canvas.height - pipeTopH - self.pipeGap);
    });
    
    // ground
    ctx.fillStyle = '#ffeb3b';
    ctx.fillRect(0, this.groundHeight, this.canvas.width, this.canvas.height - this.groundHeight);
  },
  loop: function() {
    var self = this;
    this.update();
    this.draw();
    if (this.bird.alive && !this.gameOver) {
      requestAnimationFrame(function() { self.loop(); });
    }
  }
};

Game.init();
</script>
</body>
</html>
